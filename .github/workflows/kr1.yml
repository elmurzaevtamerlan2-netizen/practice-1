name: Verify KR1
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          javac -d out KR1/*.java
          java -cp out Main
          test "$(java -cp out Main)" = 'Hello, World!'
